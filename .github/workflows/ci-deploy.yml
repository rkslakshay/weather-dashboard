name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Check JavaScript
        run: |
          node --check script.js
          node --check service-worker.js
          node --check api/weather.js

      - name: Verify Core Assets & Manifest
        run: |
          test -f index.html
          test -f style.css
          test -f manifest.json
          test -f vercel.json
          test -f assets/icon.svg

